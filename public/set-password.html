<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set your password | ExamSlot</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-right" style="min-height:100vh">
    <form id="form" class="login-form">
      <div class="brand" style="color:var(--teal)">ExamSlot</div>
      <h2>Set your password</h2>
      <p class="k">Choose a password of at least 8 characters. This link works once.</p>
      <label>New password<input id="p1" type="password" minlength="8" required></label>
      <label>Repeat password<input id="p2" type="password" minlength="8" required></label>
      <p id="msg" class="error"></p>
      <button class="b" type="submit">Save password</button>
    </form>
  </div>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      if (document.getElementById('p1').value !== document.getElementById('p2').value) { msg.textContent = 'The two passwords do not match.'; return; }
      const res = await fetch('/api/auth/set-password', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: document.getElementById('p1').value }) });
      const data = await res.json().catch(() => ({}));
      if (res.ok) document.getElementById('form').innerHTML = '<h2>Password saved</h2><p class="k">You can now sign in with your email and new password.</p><a class="b" href="/" style="text-align:center">Go to sign in</a>';
      else msg.textContent = data.error || 'Something went wrong';
    });
  </script>
</body>
</html>
