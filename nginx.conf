# Redirect HTTP (Port 80) -> HTTPS (Port 443)
server {
    listen 80;
    server_name virtual-university.duckdns.org;
    return 301 https://$host$request_uri;
}

# HTTPS Server Configuration
server {
    listen 443 ssl;
    server_name virtual-university.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/virtual-university.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/virtual-university.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Serve Frontend Static Assets
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API Requests to Node.js Container
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
